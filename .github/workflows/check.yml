name: LeviOS Outreach checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JavaScript syntax
        run: |
          node --check app.js
          node --check cloud.js
          node --check supabase/functions/gmail-bridge/index.mjs
      - name: Security invariants
        run: node tests/invariants.mjs
