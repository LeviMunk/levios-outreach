name: JobOS intake checks
on:
  push:
    paths:
      - 'scripts/**'
      - 'supabase/functions/outreach-research-intake/**'
      - '.github/workflows/jobos-ci.yml'
      - 'app.js'
      - 'cloud.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check app.js
          node --check cloud.js
          node --check scripts/discover-jobs.mjs
          node --check scripts/validate-jobos-pack.mjs
          node --check scripts/combine-research.mjs
          node --check scripts/submit-oidc-research.mjs
      - name: Contract tests
        run: node scripts/test-jobos-intake.mjs
