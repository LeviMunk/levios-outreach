name: LeviOS Outreach weekly prospect research
on:
  schedule:
    - cron: '17 14 * * 1' # Monday 08:17 CST / 09:17 CDT (UTC schedule)
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: levios-research
  cancel-in-progress: false
jobs:
  discover-and-stage:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Discover public directory candidates
        run: node scripts/discover-prospects.mjs
      - name: Validate research pack
        run: node scripts/validate-research-pack.mjs research-output/candidates.json
      - name: Stage using verified short-lived GitHub OIDC token
        env:
          INTAKE_URL: https://yfqtyuynsumvwhnmnswk.supabase.co/functions/v1/outreach-research-intake
        run: |
          node scripts/submit-oidc-research.mjs
      - name: Upload research report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: outreach-research-${{ github.run_number }}
          path: research-output/
          if-no-files-found: ignore
          retention-days: 14
