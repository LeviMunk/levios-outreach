name: JobOS local-first opportunity research
on:
  schedule:
    - cron: '17 14 * * 1-5' # weekdays; 08:17 CST / 09:17 CDT
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: levios-research
  cancel-in-progress: false
jobs:
  discover-and-stage:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Discover source-backed local and remote jobs
        run: node scripts/discover-jobs.mjs
      - name: Discover business prospects on Mondays
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 14 * * 1'
        continue-on-error: true
        run: node scripts/discover-prospects.mjs
      - name: Combine research with local-first job ordering
        run: node scripts/combine-research.mjs
      - name: Validate every record before staging
        run: node scripts/validate-jobos-pack.mjs research-output/candidates.json
      - name: Stage with a short-lived verified GitHub OIDC token
        env:
          INTAKE_URL: https://yfqtyuynsumvwhnmnswk.supabase.co/functions/v1/outreach-research-intake
        run: node scripts/submit-oidc-research.mjs
      - name: Upload research report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jobos-research
          path: research-output/
          if-no-files-found: ignore
          retention-days: 14
